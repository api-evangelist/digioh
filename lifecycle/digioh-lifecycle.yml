  note: >-
    Digioh publishes no API versioning scheme. The client-side JavaScript API is delivered from an
    unversioned CDN path (/vendor/{CLIENT_GUID}/lightbox_inline.js), so the running build changes
    under consumers without a version signal. Campaign-level versioning does exist inside the
    product - "How do I rollback our published JavaScript" and "How to Restore an Older Campaign
    Design" - but that is tenant content versioning, not contract versioning.
