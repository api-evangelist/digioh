aid: digioh
name: Digioh
description: Digioh is a US-based onsite personalization and zero-party data platform for ecommerce
  brands. It ships product recommendation quizzes, pop-ups, banners, sidebars, inline embeds, landing
  pages, email/SMS preference centers and post-purchase surveys as a JavaScript widget layer installed
  on a merchant's storefront, plus Digioh Passport for cross-session visitor identification and Digioh
  Pipelines for routing form submissions into ESP/CRM destinations such as Klaviyo, Iterable, Braze,
  Attentive, Ometria, HubSpot and Salesforce. Its developer surface is client-side rather than
  server-side - a documented browser JavaScript API (DIGIOH_API.LIGHTBOX), an outbound "API Form POST"
  webhook integration that posts submission JSON to a customer-controlled endpoint, iOS and Android
  embed SDKs, and a WordPress plugin and Shopify app. Digioh publishes no public inbound REST API, no
  OpenAPI definition and no developer portal.
