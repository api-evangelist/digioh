apis:
- name: Digioh JavaScript API
  description: Client-side browser API exposed by the Digioh widget runtime once the Digioh JavaScript
    tag is installed on a site. Documented calls include DIGIOH_API.LIGHTBOX.loadLightbox(guid) to
    manually trigger a campaign, DIGIOH_API.LIGHTBOX.isDigiohReady() to test initialization, and the
    checkConditionsLoad/Click/Hover/Scroll/Exit/Time family to re-evaluate display rules after the
    page state changes. There is no public inbound REST API and no OpenAPI definition.
  humanURL: https://help.digioh.com/docs/digioh-javascript-api
  baseURL: https://www.lightboxcdn.com
