note: >-
  Digioh publishes a named compliance posture on its own help centre. It is a claims page, not a
  report - the SOC 2 Type II report is described as "available to customers upon request", there is
  no trust portal, no auditor named, no report date and no downloadable evidence, so every entry
  below is recorded as a provider claim with its source. No API-layer standards apply: Digioh
  publishes no OpenAPI, no OAuth/OIDC surface and no RFC 9457 error contract, so those rows are
  honest false values rather than omissions.
