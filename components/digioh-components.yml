summary: >-
  Digioh is a client-side embed product. Its entire developer-facing surface is a JavaScript widget
  runtime dropped into a merchant's storefront plus a small browser API for controlling it. This
  artifact records that surface; it is the closest thing Digioh has to an API reference.
