javascript_api:
  namespace_from_host_page: DIGIOH_API.LIGHTBOX
  namespace_from_digioh_custom_js: api.LIGHTBOX
  docs: https://help.digioh.com/docs/digioh-javascript-api
  methods:
  - name: loadLightbox
    signature: api.LIGHTBOX.loadLightbox(lightbox_guid)
    description: >-
      Manually display a campaign by its long GUID, bypassing all display rules and conditions. The
      campaign must still carry at least one rule to be eligible for display at all.
    source: https://help.digioh.com/docs/how-to-manually-trigger-a-lightbox-via-api
  - name: isDigiohReady
    signature: window.DIGIOH_API.LIGHTBOX.isDigiohReady()
    description: Readiness guard - returns whether the Digioh runtime has finished initializing.
    source: https://help.digioh.com/docs/how-to-manually-trigger-a-lightbox-via-api
  - name: checkConditionsLoad
    signature: DIGIOH_API.LIGHTBOX.checkConditionsLoad()
    description: Re-evaluate load-type display rules (any campaign without click/hover/scroll/exit/time rules) and trigger eligible campaigns.
    source: https://help.digioh.com/docs/how-can-i-get-the-rules-re-evaluated
  - name: checkConditionsClick
    signature: DIGIOH_API.LIGHTBOX.checkConditionsClick()
    description: Re-evaluate click-triggered display rules.
    source: https://help.digioh.com/docs/how-can-i-get-the-rules-re-evaluated
  - name: checkConditionsHover
    signature: DIGIOH_API.LIGHTBOX.checkConditionsHover()
    description: Re-evaluate hover-triggered display rules.
    source: https://help.digioh.com/docs/how-can-i-get-the-rules-re-evaluated
  - name: checkConditionsScroll
    signature: DIGIOH_API.LIGHTBOX.checkConditionsScroll()
    description: Re-evaluate scroll-depth display rules.
    source: https://help.digioh.com/docs/how-can-i-get-the-rules-re-evaluated
  - name: checkConditionsExit
    signature: DIGIOH_API.LIGHTBOX.checkConditionsExit()
    description: Re-evaluate exit-intent display rules.
    source: https://help.digioh.com/docs/how-can-i-get-the-rules-re-evaluated
  - name: checkConditionsTime
    signature: DIGIOH_API.LIGHTBOX.checkConditionsTime()
    description: Re-evaluate time-on-page display rules.
    source: https://help.digioh.com/docs/how-can-i-get-the-rules-re-evaluated
