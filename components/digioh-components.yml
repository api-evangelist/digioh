- name: lightbox_inline.js
  url: https://www.lightboxcdn.com/vendor/{CLIENT_GUID}/lightbox_inline.js
  placement: as high in <head> as possible, on every subdomain visitors can land on
  versioned: false
  probed: {status: 200, bytes: 2549, fetched: '2026-08-12'}
  chain:
  - https://www.lightboxcdn.com/vendor/{CLIENT_GUID}/lightbox_inline.js
  - //www.zeropartyforms.com/w37htfhcq2/vendor/{CLIENT_GUID}/lightbox.js
  - //www.zeropartyforms.com/w37htfhcq2/vendor/{CLIENT_GUID}/user.js (or user_qa.js in QA mode)
  note: >-
    The observed chain runs through www.zeropartyforms.com, a Digioh-operated host that appears in
    neither the CSP requirements article nor any other public documentation. The runtime is injected
    into a hidden iframe by a lightboxjs bootstrap, which is why campaign Custom JS executes in an
    iframe and must reach the host page through window.parent.
